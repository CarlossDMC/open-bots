[package]
name = "open-bots"
version = "0.4.0"
description = "A local-first runtime for persistent AI agents"
authors = ["Open Bots contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "open_bots_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "process", "io-util", "rt", "macros", "time", "net"] }
tauri = { version = "2", features = [] }
tracing = "0.1"
# Local MCP server for runtime tools; already in the tree through Tauri. See ADR 0008.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-process = "2"
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
